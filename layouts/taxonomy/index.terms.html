{{ define "main" }}
  <article class="pa3 pa4-ns nested-copy-line-height">
    <section class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy nested-links {{ $.Param "text_color" | compare.Default "mid-gray" }}">
       <p class="f2 athelas mv5 mid-gray">Parcourir le corpus par mots-clés :</p>
       
       <!-- 1. La barre de recherche -->
       <div class="index-search-container" style="margin-bottom: 20px;">
         <input 
           type="text" 
           id="index-filter-input" 
           placeholder="Filtrer les termes de l'index..." 
           style="width: 100%; max-width: 500px; padding: 10px 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px;"
         />
       </div>
    </section>

    <!-- 2. Le conteneur global de la grille -->
    <section id="terms-container" class="flex flex-wrap">
      <!-- .Data.Terms contient la liste de tous les termes -->
      {{ range .Data.Terms.ByCount }}
        <div class="term-item w-100 w-third-ns ph2 mb3">
          <a href="{{ .Page.RelPermalink }}" class="term-btn link f5 grow br-pill ba ph3 pv2 mb2 mh2 blue sans-serif no-underline db tc">
            <span>{{ .Page.Title }}</span>
            <span>({{ .Count }})</span>
          </a>
        </div>
      {{ end }}
    </section>

    <!-- 3. Le script de filtrage instantané -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const filterInput = document.getElementById('index-filter-input');
        const termItems = document.querySelectorAll('#terms-container .term-item');

        filterInput.addEventListener('input', function (e) {
          const filterText = e.target.value.toLowerCase().trim();

          termItems.forEach(item => {
            const termName = item.querySelector('.term-btn').textContent.toLowerCase();

            if (termName.includes(filterText)) {
              item.style.display = ""; 
            } else {
              item.style.display = "none"; 
            }
          });
        });
      });
    </script>

  </article>
{{ end }}
