{{ define "main" }}
  <article class="pa3 pa4-ns nested-copy-line-height">
    <section class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy nested-links {{ $.Param "text_color" | compare.Default "mid-gray" }}">
       <p class="f2 athelas mv5 mid-gray">Parcourir le corpus par mots-clés :</p>
    </section>
    <section class="flex flex-wrap -mx2">
      <!-- .Data.Terms contient la liste de tous les termes et leurs œuvres -->
      {{ range .Data.Terms.ByCount }}
        <div class="w-100 w-third-ns ph2 mb3">
          <a href="{{ .Page.RelPermalink }}" class="link f5 grow br-pill ba ph3 pv2 mb2 mh2 blue sans-serif no-underline db tc">
            <span>{{ .Page.Title }}</span>
            <span>({{ .Count }})</span>
          </a>
        </div>
      {{ end }}
    </section>
  </article>
{{ end }}
